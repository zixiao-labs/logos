name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native rebuild)
        run: npm ci --ignore-scripts

      - name: Run Test
        run: npm run test  

      - name: Unit and integration tests with coverage
        run: npm run test:coverage -- --reporter=github-actions

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Typecheck
        run: npm run typecheck

      - name: Build (renderer + main + preload)
        run: npm run build:app
