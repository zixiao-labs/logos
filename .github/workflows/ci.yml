name: CI

# Fast validation on every branch push and PR: typecheck + full Electron build.
# Native modules are not needed to compile/bundle, so we skip the install
# scripts (electron-rebuild) here to keep this job quick — the release workflow
# does the full install.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native rebuild)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build (renderer + main + preload)
        run: npm run build:app
