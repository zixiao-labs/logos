name: Release

# Triggered by pushing a version tag, e.g. `git tag v1.0.1 && git push --tags`.
# Each OS runner builds its own installers and publishes them (plus the
# `latest*.yml` metadata electron-updater reads) to a GitHub Release for the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create/update the GitHub Release

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native rebuild)
        run: |
          npm ci --ignore-scripts
          # Tests import Electron APIs, but the root electron-rebuild is unnecessary here.
          npm rebuild electron

      - name: Unit and integration tests with coverage
        run: npm run test:coverage -- --reporter=github-actions

      - name: Typecheck
        run: npm run typecheck

      - name: Build (renderer + main + preload)
        run: npm run build:app

  release:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Full install — postinstall electron-rebuild builds node-pty against
      # Electron's ABI for this runner's OS/arch.
      - name: Install dependencies
        run: npm ci

      # Stage the bundled language servers (G1). Runs per-OS so the .bin shims
      # are platform-correct (.cmd on Windows).
      - name: Stage bundled language servers
        run: npm run prepackage:servers

      - name: Stage bundled JavaScript debug adapter
        run: npm run prepackage:debug-adapters
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage bundled debug MCP server
        run: npm run prepackage:debug-mcp

      - name: Build (renderer + main + preload)
        run: npm run build:app

      # Only export optional signing/notarization credentials when they are
      # actually configured. Passing empty CSC_LINK/WIN_CSC_LINK makes
      # electron-builder resolve the empty value to the workspace directory and
      # fail with "not a file" on CI.
      - name: Configure optional signing environment
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          write_env() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              {
                echo "$name<<__LOGOS_ENV__"
                printf '%s\n' "$value"
                echo "__LOGOS_ENV__"
              } >> "$GITHUB_ENV"
            fi
          }

          write_env CSC_LINK "$CSC_LINK_SECRET"
          write_env CSC_KEY_PASSWORD "$CSC_KEY_PASSWORD_SECRET"
          write_env APPLE_ID "$APPLE_ID_SECRET"
          write_env APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
          write_env APPLE_TEAM_ID "$APPLE_TEAM_ID_SECRET"
          write_env WIN_CSC_LINK "$WIN_CSC_LINK_SECRET"
          write_env WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD_SECRET"

          if { [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK_SECRET" ]; } || \
             { [ "$RUNNER_OS" = "Windows" ] && [ -z "$CSC_LINK_SECRET" ] && [ -z "$WIN_CSC_LINK_SECRET" ]; }; then
            write_env CSC_IDENTITY_AUTO_DISCOVERY "false"
          fi

      - name: Build & publish installers
        run: npx --no-install electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
